<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="980" viewBox="0 0 1300 980">
  <rect width="1300" height="980" fill="#080b12"/>
  <text x="70" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="800" fill="#f8fafc">
    Automation Architecture
  </text>
  <text x="70" y="158" font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#cbd5e1">
    Tests stay readable while selectors, actions, data, and evidence stay reusable.
  </text>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <g transform="translate(90 280)">
    <rect width="250" height="118" rx="16" fill="#0f1f3d" stroke="#3b82f6" stroke-width="2"/>
    <text x="34" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800" fill="#93c5fd">Tests</text>
    <text x="34" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#e2e8f0">login, cart, checkout</text>
  </g>

  <line x1="360" y1="339" x2="472" y2="339" stroke="#94a3b8" stroke-width="5" marker-end="url(#arrow)"/>

  <g transform="translate(490 280)">
    <rect width="300" height="118" rx="16" fill="#0f2d22" stroke="#22c55e" stroke-width="2"/>
    <text x="34" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800" fill="#86efac">Page Objects</text>
    <text x="34" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#e2e8f0">selectors and actions</text>
  </g>

  <line x1="810" y1="339" x2="922" y2="339" stroke="#94a3b8" stroke-width="5" marker-end="url(#arrow)"/>

  <g transform="translate(940 280)">
    <rect width="250" height="118" rx="16" fill="#33210f" stroke="#f97316" stroke-width="2"/>
    <text x="34" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800" fill="#fdba74">Playwright</text>
    <text x="34" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#e2e8f0">browser engine</text>
  </g>

  <g transform="translate(90 540)">
    <rect width="330" height="118" rx="14" fill="#172033" stroke="#475569" stroke-width="2"/>
    <text x="28" y="39" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="800" fill="#f8fafc">Test Data</text>
    <text x="28" y="69" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#cbd5e1">users and checkout inputs</text>
  </g>

  <g transform="translate(485 540)">
    <rect width="330" height="118" rx="14" fill="#172033" stroke="#475569" stroke-width="2"/>
    <text x="28" y="39" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="800" fill="#f8fafc">Fixture</text>
    <text x="28" y="69" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#cbd5e1">red click highlight</text>
  </g>

  <g transform="translate(880 540)">
    <rect width="330" height="118" rx="14" fill="#172033" stroke="#475569" stroke-width="2"/>
    <text x="28" y="39" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="800" fill="#f8fafc">Evidence</text>
    <text x="28" y="69" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#cbd5e1">videos, screenshots, report</text>
  </g>

  <g transform="translate(485 746)">
    <rect width="330" height="118" rx="16" fill="#331528" stroke="#ec4899" stroke-width="2"/>
    <text x="34" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800" fill="#f9a8d4">CI</text>
    <text x="34" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#e2e8f0">typecheck and tests</text>
  </g>
</svg>
